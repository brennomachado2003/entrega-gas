spring.application.name=gateway

server.port=8091

spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.enabled=true
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8088/eureka/


# =========================
# ROTA SSE - NOTIFICAÇÃO
# =========================


spring.cloud.gateway.server.webmvc.routes[0].id=notificacao-sse
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://notificacao
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/notificacoes/entregadores/{idEntregador}/stream


# =========================
# ROTA SSE - PEDIDO ACEITO
# =========================

spring.cloud.gateway.server.webmvc.routes[1].id=pedido-aceito-sse
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://pedidos
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/pedidoAceito/*/stream