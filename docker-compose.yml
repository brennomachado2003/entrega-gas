services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: uber-gas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql
    networks:
      - microservicos-net

  kafka-1:
    image: apache/kafka:4.3.1
    container_name: kafka-1
    hostname: kafka-1

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >
        INTERNAL://:19092,
        CONTROLLER://:29092,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-1:19092,
        EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:29092,
        2@kafka-2:29092

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - microservicos-net


  kafka-2:
    image: apache/kafka:4.3.1
    container_name: kafka-2
    hostname: kafka-2

    ports:
      - "9093:9092"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >
        INTERNAL://:19092,
        CONTROLLER://:29092,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-2:19092,
        EXTERNAL://localhost:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:29092,
        2@kafka-2:29092

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - microservicos-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8095:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >
        kafka-1:19092,
        kafka-2:19092,
    depends_on:
      - kafka-1
      - kafka-2
    networks:
      - microservicos-net

  server:
    build: ./back-end/server
    container_name: server
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    networks:
      - microservicos-net

  empresa:
    build: ./back-end/empresa
    container_name: empresa
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/empresa
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8083:8083"
    networks:
      - microservicos-net

  entregador:
    build: ./back-end/entregador
    container_name: entregador
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/entregador
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8086:8086"
    networks:
      - microservicos-net

  estoque:
    build: ./back-end/estoque
    container_name: estoque
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/estoque
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8087:8087"
    networks:
      - microservicos-net

  gateway:
    build: ./back-end/gateway
    container_name: gateway
    depends_on:
      - server
      - notificacao
      - pedidos
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8091:8091"
    networks:
      - microservicos-net

  logistica:
    build: ./back-end/logistica
    container_name: logistica
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/logistica
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201

    ports:
      - "8084:8084"
    networks:
      - microservicos-net

  notificacao:
    build: ./back-end/notificacao
    container_name: notificacao
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notificacao
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8090:8090"
    networks:
      - microservicos-net

  pedidos:
    build: ./back-end/pedidos
    container_name: pedidos
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pedidos
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8089:8089"
    networks:
      - microservicos-net

  produtos:
    build: ./back-end/produtos
    container_name: produtos
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/produtos
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8082:8082"
    networks:
      - microservicos-net

  usuario:
    build: ./back-end/usuario
    container_name: usuario
    depends_on:
      - server
      - kafka-1
      - kafka-2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server:8088/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/usuario
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:19092,kafka-2:19092
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
    ports:
      - "8085:8085"
    networks:
      - microservicos-net

  frontend:
    build: ./front-end/entrega/entrega-app
    container_name: frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"
    networks:
      - microservicos-net


  mongodb:
    image: mongo:7.0
    container_name: uber-gas-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - microservicos-net


  graylog-datanode:
    image: graylog/graylog-datanode:7.1
    container_name: uber-gas-graylog-datanode
    hostname: graylog-datanode
    restart: unless-stopped
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: /var/lib/graylog-datanode/node-id
      GRAYLOG_DATANODE_PASSWORD_SECRET: "3b0c21bf4ed917abc258fdca710949845296f34d8857fc585f2402663b212adc"
      GRAYLOG_DATANODE_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    volumes:
      - graylog_datanode:/var/lib/graylog-datanode
    depends_on:
      - mongodb
    networks:
      - microservicos-net


  graylog:
    image: graylog/graylog:7.1
    container_name: uber-gas-graylog
    hostname: graylog
    restart: unless-stopped

    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://localhost:9000/"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
      GRAYLOG_REPORT_DISABLE_SANDBOX: "true"
      GRAYLOG_PASSWORD_SECRET: "3b0c21bf4ed917abc258fdca710949845296f34d8857fc585f2402663b212adc"
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"

    ports:
      - "9000:9000"
      - "12201:12201/tcp"
      - "12201:12201/udp"

    volumes:
      - graylog_data:/usr/share/graylog/data

    depends_on:
      - mongodb
      - graylog-datanode

    networks:
      - microservicos-net

  graylog-init:
    image: curlimages/curl:latest
    container_name: graylog-init
    depends_on:
      - graylog
    volumes:
      - ./graylog-init/init.sh:/init.sh:ro
    entrypoint: [ "/bin/sh", "/init.sh" ]
    networks:
      - microservicos-net

networks:
  microservicos-net:



volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:
  graylog_datanode:
  graylog_data:

